name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: urdia
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: urdia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urdia -d urdia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://urdia:ci@localhost:5432/urdia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate
        run: alembic upgrade head
      - name: Seed (dev smoke)
        run: python -m scripts.seed
      - name: Worker shell smoke
        run: python -m apps.worker --once
      - name: Tests (unit + integration + DB parity)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

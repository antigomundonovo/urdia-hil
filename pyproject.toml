[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urdia-hil"
version = "0.3.0"
description = "URDIA — History Intelligence Layer: motor de inteligência editorial histórica"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
laya = [
    "laya==0.3.22",
]

[project.scripts]
urdia-doctor = "scripts.doctor:main"
urdia-seed = "scripts.seed:seed"
urdia-laya-shadow = "scripts.laya_shadow:main"
urdia-enqueue = "scripts.enqueue:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "integration: requires a running PostgreSQL with pgvector (docker compose up -d postgres)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations/template keep their generated style (long Column lines,
# typing.Union) — style rules don't apply to versioned DDL.
"migrations/**" = ["E501", "UP007", "UP035", "I001"]
"tests/test_db_core.py" = ["F841"]
# FastAPI's canonical DI idiom uses Query(...)/Depends(...) in defaults.
"apps/api/**" = ["B008"]
# Ops scripts: long report lines and local imports are fine here.
"scripts/**" = ["E501", "I001", "E401", "UP017"]
